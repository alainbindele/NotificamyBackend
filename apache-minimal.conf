# Configurazione Apache MINIMA per debug
# Sostituisce temporaneamente la configurazione esistente

<VirtualHost *:80>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    Redirect permanent / https://notificamy.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    
    # SSL
    SSLEngine on
    SSLCertificateFile /etc/cert/notificamy.com_ssl_certificate.pem
    SSLCertificateKeyFile /etc/cert/notificamy.com_ssl_certificate.key
    
    # Frontend
    DocumentRoot /var/www/notificamy/dist
    
    <Directory /var/www/notificamy/dist>
        Require all granted
        FallbackResource /index.html
    </Directory>
    
    # API Proxy - SENZA AUTENTICAZIONE
    <Location /api/>
        ProxyPass http://localhost:8080/api/
        ProxyPassReverse http://localhost:8080/api/
        ProxyPreserveHost On
        
        # Headers essenziali
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        # NESSUNA AUTENTICAZIONE
        Require all granted
    </Location>
    
    # Log
    ErrorLog ${APACHE_LOG_DIR}/notificamy_error.log
    CustomLog ${APACHE_LOG_DIR}/notificamy_access.log combined
    LogLevel info
</VirtualHost>