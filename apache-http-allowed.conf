# Configurazione Apache che permette HTTP e HTTPS
# File: /etc/apache2/sites-available/notificamy.conf

# Virtual Host HTTP - NON fa redirect, serve direttamente
<VirtualHost *:80>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    
    # Frontend React
    DocumentRoot /var/www/notificamy/dist
    
    <Directory /var/www/notificamy/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    
    # API Proxy HTTP
    <Location /api/>
        ProxyPass http://localhost:8080/api/
        ProxyPassReverse http://localhost:8080/api/
        ProxyPreserveHost On
        
        # Headers per il backend
        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Port "80"
        
        # Nessuna autenticazione
        Require all granted
    </Location>
    
    # Log
    ErrorLog ${APACHE_LOG_DIR}/notificamy_http_error.log
    CustomLog ${APACHE_LOG_DIR}/notificamy_http_access.log combined
</VirtualHost>

# Virtual Host HTTPS - opzionale
<VirtualHost *:443>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    
    # SSL
    SSLEngine on
    SSLCertificateFile /etc/cert/notificamy.com_ssl_certificate.pem
    SSLCertificateKeyFile /etc/cert/notificamy.com_ssl_certificate.key
    
    # Frontend React
    DocumentRoot /var/www/notificamy/dist
    
    <Directory /var/www/notificamy/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    
    # API Proxy HTTPS
    <Location /api/>
        ProxyPass http://localhost:8080/api/
        ProxyPassReverse http://localhost:8080/api/
        ProxyPreserveHost On
        
        # Headers per il backend
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        # Nessuna autenticazione
        Require all granted
    </Location>
    
    # Log
    ErrorLog ${APACHE_LOG_DIR}/notificamy_https_error.log
    CustomLog ${APACHE_LOG_DIR}/notificamy_https_access.log combined
</VirtualHost>