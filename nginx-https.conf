# Configurazione Nginx per HTTPS obbligatorio
server {
    listen 80;
    server_name notificamy.com www.notificamy.com;
    
    # Redirect TUTTO il traffico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notificamy.com www.notificamy.com;
    
    # Certificati SSL
    ssl_certificate /etc/ssl/certs/notificamy.com.crt;
    ssl_certificate_key /etc/ssl/private/notificamy.com.key;
    
    # Configurazione SSL sicura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Frontend (React app)
    location / {
        root /var/www/notificamy;
        try_files $uri $uri/ /index.html;
        
        # Cache statico
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Backend API - SOLO HTTPS
    location /api/ {
        # Verifica che la richiesta sia HTTPS
        if ($scheme != "https") {
            return 403 '{"success":false,"error":"HTTPS required","code":"HTTPS_REQUIRED"}';
        }
        
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Headers di sicurezza per API
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        
        # CORS headers (gestiti dal backend)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }
    
    # Health check - può rimanere HTTP per load balancer
    location /api/v1/health {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Nessun cache per health check
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}