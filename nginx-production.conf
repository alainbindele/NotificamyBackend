# Configurazione Nginx per produzione
server {
    listen 80;
    server_name notificamy.com www.notificamy.com;
    
    # Redirect HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notificamy.com www.notificamy.com;
    
    # Certificati SSL
    ssl_certificate /etc/ssl/certs/notificamy.com.crt;
    ssl_certificate_key /etc/ssl/private/notificamy.com.key;
    
    # Configurazione SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    
    # Headers di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    
    # Frontend React
    location / {
        root /var/www/notificamy;
        try_files $uri $uri/ /index.html;
        
        # Cache per asset statici
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API Backend - Proxy verso HTTP interno
    location /api/ {
        # Proxy verso Spring Boot HTTP interno
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # IMPORTANTE: dice al backend che è HTTPS
        proxy_set_header X-Forwarded-Port 443;
        
        # Timeout
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Headers CORS (lascia che il backend li gestisca)
        proxy_hide_header Access-Control-Allow-Origin;
    }
}