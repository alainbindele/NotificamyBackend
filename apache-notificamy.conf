# Configurazione Apache per NotifyMe
# File: /etc/apache2/sites-available/notificamy.conf

# Redirect HTTP a HTTPS
<VirtualHost *:80>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    
    # Redirect TUTTO il traffico HTTP a HTTPS
    Redirect permanent / https://notificamy.com/
</VirtualHost>

# Configurazione HTTPS principale
<VirtualHost *:443>
    ServerName notificamy.com
    ServerAlias www.notificamy.com
    
    # Certificati SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/notificamy.com.crt
    SSLCertificateKeyFile /etc/ssl/private/notificamy.com.key
    # SSLCertificateChainFile /etc/ssl/certs/notificamy.com.chain.crt  # Se hai un chain file
    
    # Configurazione SSL sicura
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Headers di sicurezza
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Document root per il frontend React
    DocumentRoot /var/www/notificamy
    
    # Configurazione per il frontend (React SPA)
    <Directory /var/www/notificamy>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        
        # Fallback per React Router
        FallbackResource /index.html
    </Directory>
    
    # Cache per asset statici
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </LocationMatch>
    
    # Proxy per le API backend
    <Location /api/>
        # Abilita il proxy
        ProxyPreserveHost On
        ProxyPass http://localhost:8080/api/
        ProxyPassReverse http://localhost:8080/api/
        
        # Headers per il backend
        ProxyPassReverse http://localhost:8080/api/
        ProxyAddHeaders On
        
        # Informa il backend che la richiesta originale era HTTPS
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        # Headers di sicurezza per API
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        
        # Timeout
        ProxyTimeout 30
    </Location>
    
    # Health check specifico (opzionale)
    <Location /api/v1/health>
        ProxyPass http://localhost:8080/api/v1/health
        ProxyPassReverse http://localhost:8080/api/v1/health
        
        # Nessun cache per health check
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
    
    # Log
    ErrorLog ${APACHE_LOG_DIR}/notificamy_error.log
    CustomLog ${APACHE_LOG_DIR}/notificamy_access.log combined
    
    # Log SSL
    LogLevel ssl:warn
</VirtualHost>